# 2026-10-02 dnsleaktest 干净版本(目前Clash Verge Rev 测试无DNS泄露)
dns:
  enable: true
  listen: '127.0.0.1:1053'
  enhanced-mode: 'fake-ip'
  fake-ip-range: '198.18.0.1/16'
  fake-ip-range6: '2001:2::0/64'
  fake-ip-filter-mode: 'blacklist'
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: true
  ipv6: true
  fake-ip-filter:
    - '*'
    - '+.lan'
    - '+.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftncsi.com'
    - '+.msftconnecttest.com'
  default-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
  nameserver:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
  nameserver-policy:
    geosite:cn:
      - 'https://223.5.5.5/dns-query'
      - 'https://120.53.53.53/dns-query'
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: true
    geoip-code: 'CN'
    ipcidr:
      - '240.0.0.0/4'
      - '0.0.0.0/32'
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
  fallback: []
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
  direct-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://120.53.53.53/dns-query'
hosts: {}
